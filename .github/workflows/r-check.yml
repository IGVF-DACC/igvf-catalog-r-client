name: R CMD check

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # main holds no package until the first release is generated
      - id: package
        run: echo "present=$([ -f DESCRIPTION ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: r-lib/actions/setup-r@v2
        if: steps.package.outputs.present == 'true'
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.package.outputs.present == 'true'
      # Plain R CMD check fails on errors only. The generated code has no Rd
      # docs (no man/), which check reports as a warning.
      - name: Build and check
        if: steps.package.outputs.present == 'true'
        run: |
          R CMD build .
          R CMD check --no-manual igvfcatalogclient_*.tar.gz
